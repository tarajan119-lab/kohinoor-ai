name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Min SDK and Android v1 Embedding
        run: |
          # Fix Min SDK
          FILE="android/app/build.gradle"
          if grep -q "minSdkVersion" "$FILE"; then
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' "$FILE"
          else
            sed -i '/defaultConfig {/a \        minSdkVersion 21' "$FILE"
          fi
          
          # Remove obsolete Android v1 embedding meta-data if present
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/flutterEmbedding/d' "$MANIFEST"
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
