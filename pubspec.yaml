name: kohinoor_ai
description: "A voice-controlled assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9+2
  url_launcher: ^6.3.1
  http: ^1.2.2
  installed_apps: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
